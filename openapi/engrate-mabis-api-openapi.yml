openapi: 3.2.0
info:
  title: Engrate Mabis API
  version: 1.0.0
servers:
- url: https://api.engrate.io
security:
- apiKeyAuth: []
tags:
- name: mabis
paths:
  /schedule-management/v1/mabis/aggregation-objects:
    get:
      description: 'List registered aggregation objects.


        Returns aggregation objects registered via UTILMD messages for energy settlement purposes. BRP is automatically filtered via org_uid.


        Args: tso: Optional TSO Y area code filter (e.g., 10YDE-EON------1) sender: Optional sender MP-ID filter (DSO) - returns MGAs managed by this DSO aggregation_object: Optional specific object ID filter aggregation_type: Optional type filter (BAS, FPE, FPI, SLP, RLM) aggregation_subtype: Optional OBIS code filter month: Optional month for validity check (YYYY-MM)


        Returns: List of matching aggregation objects'
      operationId: list_aggregation_objects_schedule_management_v1_mabis_aggregation_objects_get
      parameters:
      - description: TSO Y area code filter (e.g., 10YDE-EON------1)
        in: query
        name: tso_area
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: TSO Y area code filter (e.g., 10YDE-EON------1)
          title: Tso Area
      - description: Sender MP-ID filter (DSO) - returns MGAs managed by this DSO
        in: query
        name: sender
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sender MP-ID filter (DSO) - returns MGAs managed by this DSO
          title: Sender
      - description: Aggregation object ID filter
        in: query
        name: aggregation_object
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Aggregation object ID filter
          title: Aggregation Object
      - description: 'Aggregation type filter. ''BAS'': Bilanzkreisabweichungssaldo, the balance group''s imbalance settled as balancing energy (exported on a surplus, imported on a deficit). ''FPE'': Fahrplanentnahmesumme, scheduled offtake exported from the balance group. ''FPI'': Fahrplaneinspeisesumme, scheduled feed-in imported into the balance group. ''SLP'': Standardlastprofil, aggregated offtake of metering points settled on a standard load profile. ''RLM'': Registrierende Leistungsmessung, aggregated offtake of interval-metered metering points.'
        in: query
        name: aggregation_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Aggregation type filter. ''BAS'': Bilanzkreisabweichungssaldo, the balance group''s imbalance settled as balancing energy (exported on a surplus, imported on a deficit). ''FPE'': Fahrplanentnahmesumme, scheduled offtake exported from the balance group. ''FPI'': Fahrplaneinspeisesumme, scheduled feed-in imported into the balance group. ''SLP'': Standardlastprofil, aggregated offtake of metering points settled on a standard load profile. ''RLM'': Registrierende Leistungsmessung, aggregated offtake of interval-metered metering points.'
          title: Aggregation Type
      - description: Subtype/OBIS code filter
        in: query
        name: aggregation_subtype
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Subtype/OBIS code filter
          title: Aggregation Subtype
      - description: Month for validity filter (YYYY-MM)
        in: query
        name: month
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Month for validity filter (YYYY-MM)
          title: Month
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AggregationObjectResponse'
                title: Response List Aggregation Objects Schedule Management V1 Mabis Aggregation Objects Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Aggregation Objects
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-calendar:
    get:
      description: 'Get MaBiS clearing deadlines for a settlement month.


        Returns all relevant MaBiS clearing deadlines based on Werktag (working day, Mon–Fri excluding DE public holidays) calculations per BK6-24-174 Section 3.10.


        **Key deadlines** - Erstaufschlag BG-SZR: M+10 WT — TSO publishes initial balance group summary - Erstaufschlag BK-SZR: M+12 WT — TSO publishes initial balance circle summary - Clearing start BG-SZR: M+11 WT - Clearing start BK-SZR: M+13 WT - Preliminary billing: M+18 WT - Clearing end: M+30 WT — objection window closes - Final billing: M+42 WT


        **Current phase values**: ''erstaufschlag'', ''clearing'', ''final'', ''closed''


        Example: pass `bilanzierungsmonat=2026-01-01` to get deadlines for January 2026.'
      operationId: get_clearing_calendar_schedule_management_v1_mabis_clearing_calendar_get
      parameters:
      - description: Settlement month (YYYY-MM-DD, first day of month)
        in: query
        name: bilanzierungsmonat
        required: true
        schema:
          description: Settlement month (YYYY-MM-DD, first day of month)
          format: date
          title: Bilanzierungsmonat
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingCalendarResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Clearing Calendar
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods:
    get:
      description: 'List Clearing Periods for the organization.


        A clearing period covers one calendar month (Bilanzierungsmonat) for a given balance group (Bilanzkreis). The MaBiS process starts at M+5 WT (Erstaufschlag) and closes at M+42 WT (final settlement).


        Filters: - status: Filter by status — ''open'', ''preliminary'', ''objection'', ''final'', ''closed'' - bilanzkreis_eic: Filter by balance group EIC X code (16-char, starts with ''11X'')'
      operationId: list_clearing_periods_schedule_management_v1_mabis_clearing_periods_get
      parameters:
      - description: 'Filter by clearing status: `open`, `preliminary`, `objection`, `final`, or `closed`.'
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by clearing status: `open`, `preliminary`, `objection`, `final`, or `closed`.'
          title: Status
      - description: Filter by balance group EIC X code (16-character, starts with `11X`).
        in: query
        name: bilanzkreis_eic
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by balance group EIC X code (16-character, starts with `11X`).
          title: Bilanzkreis Eic
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClearingPeriodResponse'
                title: Response List Clearing Periods Schedule Management V1 Mabis Clearing Periods Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Clearing Periods
      tags:
      - mabis
    post:
      description: 'Create a new Clearing Period.


        A clearing period represents one Bilanzierungsmonat for a Bilanzkreis. The deadlines should match the MaBiS calendar: preliminary at M+18 WT, objection window closing at M+30 WT, and final settlement at M+42 WT. Use `GET /mabis/clearing-calendar` to calculate the exact dates for a given month.'
      operationId: create_clearing_period_schedule_management_v1_mabis_clearing_periods_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearingPeriodCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingPeriodResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Clearing Period
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods/{uid}:
    get:
      description: 'Get detailed Clearing Period with aggregated summary.


        Returns the clearing period header plus counts of settlements, objections, and messages, the total imbalance, and the next upcoming MaBiS deadline (preliminary at M+18 WT or final at M+42 WT).'
      operationId: get_clearing_period_schedule_management_v1_mabis_clearing_periods__uid__get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingPeriodSummaryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Clearing Period
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods/{uid}/imbalance:
    get:
      description: 'Calculate energy imbalance for a clearing period.


        Compares the scheduled values (from submitted schedules) against the actual metering values (from MSCONS messages) for each day of the clearing period. The imbalance cost uses the reBAP price (Regelenergiebilanzausgleichspreis) received via PRICAT from the TSO.


        Returns total scheduled/actual MWh, total imbalance MWh and cost EUR, and a per-day breakdown.'
      operationId: calculate_imbalance_schedule_management_v1_mabis_clearing_periods__uid__imbalance_get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImbalanceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Calculate Imbalance
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods/{uid}/messages:
    get:
      description: 'List EDIFACT messages for a clearing period.


        Filters: - message_type: IFTSTA, UTILMD, MSCONS, PARTIN - direction: inbound, outbound - status: pending, sent, delivered, acknowledged, etc.'
      operationId: list_messages_schedule_management_v1_mabis_clearing_periods__uid__messages_get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      - description: 'Filter by EDIFACT message type: `MSCONS`, `PRICAT`, `UTILMD`, `IFTSTA`, `PARTIN`.'
        in: query
        name: message_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by EDIFACT message type: `MSCONS`, `PRICAT`, `UTILMD`, `IFTSTA`, `PARTIN`.'
          title: Message Type
      - description: 'Filter by direction: `inbound` or `outbound`.'
        in: query
        name: direction
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by direction: `inbound` or `outbound`.'
          title: Direction
      - description: 'Filter by processing status: `pending`, `processed`, `failed`, or `acknowledged`.'
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by processing status: `pending`, `processed`, `failed`, or `acknowledged`.'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SettlementMessageResponse'
                title: Response List Messages Schedule Management V1 Mabis Clearing Periods  Uid  Messages Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Messages
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods/{uid}/objections:
    get:
      description: 'List Objections filed for a clearing period.


        Filters: - status: Filter by status — ''draft'', ''submitted'', ''accepted'', ''rejected'', ''withdrawn'''
      operationId: list_objections_schedule_management_v1_mabis_clearing_periods__uid__objections_get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      - description: 'Filter by objection status: `draft`, `submitted`, `accepted`, `rejected`, or `withdrawn`.'
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by objection status: `draft`, `submitted`, `accepted`, `rejected`, or `withdrawn`.'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ObjectionResponse'
                title: Response List Objections Schedule Management V1 Mabis Clearing Periods  Uid  Objections Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Objections
      tags:
      - mabis
    post:
      description: 'Submit a MaBiS Objection (Einspruch) for a clearing period. **Coming soon.**


        An objection disputes the TSO''s settlement values within the clearing window (M+10 to M+30 WT per BK6-24-174). The TSO will respond via UTILMD with acceptance or rejection, updating the objection status.


        The `disputed_values` field is a free-form dict describing the contested data (e.g., `{"date": "2026-01-15", "interval": 42, "value_mwh": 1.5}`).'
      operationId: create_objection_schedule_management_v1_mabis_clearing_periods__uid__objections_post
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectionCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Objection
      tags:
      - mabis
      x-mint:
        content: <Note>**Coming soon.**</Note>
  /schedule-management/v1/mabis/clearing-periods/{uid}/settlements:
    get:
      description: 'List daily Clearing Settlements for a clearing period.


        Each record represents one calendar day of MSCONS metering data received from the TSO/DSO. The `values` field contains the raw interval data as parsed from the MSCONS EDIFACT message.'
      operationId: list_settlements_schedule_management_v1_mabis_clearing_periods__uid__settlements_get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClearingSettlementResponse'
                title: Response List Settlements Schedule Management V1 Mabis Clearing Periods  Uid  Settlements Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Settlements
      tags:
      - mabis
  /schedule-management/v1/mabis/clearing-periods/{uid}/validate:
    get:
      description: 'Validate clearing data completeness for a clearing period.


        Checks that: - All expected settlement days have MSCONS data - The required EDIFACT messages are present - The clearing period status allows submission


        Returns a `valid` flag, counts of settlements/messages vs expected, and a list of human-readable `issues` describing any gaps found.'
      operationId: validate_clearing_data_schedule_management_v1_mabis_clearing_periods__uid__validate_get
      parameters:
      - description: Clearing period unique identifier.
        in: path
        name: uid
        required: true
        schema:
          description: Clearing period unique identifier.
          format: uuid
          title: Uid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Validate Clearing Data
      tags:
      - mabis
  /schedule-management/v1/mabis/control-energy-prices:
    get:
      description: 'Get control energy prices (reBAP) for settlement calculations.


        Returns balancing energy prices (Regelzonenübergreifender Bilanzausgleichsenergiepreis) received from TSOs via PRICAT messages.


        Args: tso_area: Optional filter by TSO control area (e.g., 10YDE-VE-------2) month: Optional filter by month (YYYY-MM format)


        Returns: List of control energy price records with interval data'
      operationId: get_control_energy_prices_schedule_management_v1_mabis_control_energy_prices_get
      parameters:
      - description: 'TSO control area EIC Y code filter. DE values: ''10YDE-VE-------2'' (50Hertz), ''10YDE-RWENET---I'' (Amprion), ''10YDE-EON------1'' (TenneT DE), ''10YDE-ENBW-----N'' (TransnetBW).'
        in: query
        name: tso_area
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'TSO control area EIC Y code filter. DE values: ''10YDE-VE-------2'' (50Hertz), ''10YDE-RWENET---I'' (Amprion), ''10YDE-EON------1'' (TenneT DE), ''10YDE-ENBW-----N'' (TransnetBW).'
          title: Tso Area
      - description: 'Month filter (YYYY-MM). Example: ''2026-01''.'
        in: query
        name: month
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Month filter (YYYY-MM). Example: ''2026-01''.'
          title: Month
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ControlEnergyPriceResponse'
                title: Response Get Control Energy Prices Schedule Management V1 Mabis Control Energy Prices Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Control Energy Prices
      tags:
      - mabis
  /schedule-management/v1/mabis/energy-volumes:
    get:
      description: 'List energy volumes from MSCONS messages.


        Returns energy volume records stored from parsed MSCONS messages, ordered by message_date descending (latest first).


        Args: mabis_zp_id: Optional filter by MaBiS-Zählpunkt ID aggregation_object_uid: Optional filter by linked aggregation object bilanzierungsmonat: Optional filter by settlement month


        Returns: List of energy volume records'
      operationId: list_energy_volumes_schedule_management_v1_mabis_energy_volumes_get
      parameters:
      - description: Filter by MaBiS-ZP ID
        in: query
        name: mabis_zp_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by MaBiS-ZP ID
          title: Mabis Zp Id
      - description: Filter by aggregation object UID
        in: query
        name: aggregation_object_uid
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Filter by aggregation object UID
          title: Aggregation Object Uid
      - description: Filter by settlement month (YYYY-MM-DD)
        in: query
        name: bilanzierungsmonat
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by settlement month (YYYY-MM-DD)
          title: Bilanzierungsmonat
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EnergyVolumeResponse'
                title: Response List Energy Volumes Schedule Management V1 Mabis Energy Volumes Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Energy Volumes
      tags:
      - mabis
  /schedule-management/v1/mabis/energy-volumes/{mabis_zp_id}/monthly-summary:
    get:
      description: 'Get monthly energy summary and cost calculation.


        Returns the monthly energy totals and optional cost calculation for a specific MaBiS-Zählpunkt. Uses the latest version (by message_date).


        Args: mabis_zp_id: MaBiS-Zählpunkt identifier bilanzierungsmonat: Settlement month (first day of month) tso_area: TSO control area EIC (required for cost calculation)


        Returns: Monthly summary with energy and optional cost data'
      operationId: get_monthly_summary_schedule_management_v1_mabis_energy_volumes__mabis_zp_id__monthly_summary_get
      parameters:
      - description: MaBiS-Zaehlpunkt identifier.
        in: path
        name: mabis_zp_id
        required: true
        schema:
          description: MaBiS-Zaehlpunkt identifier.
          title: Mabis Zp Id
          type: string
      - description: Settlement month (YYYY-MM-DD, first day of month)
        in: query
        name: bilanzierungsmonat
        required: true
        schema:
          description: Settlement month (YYYY-MM-DD, first day of month)
          format: date
          title: Bilanzierungsmonat
          type: string
      - description: TSO control area (required for cost calculation)
        in: query
        name: tso_area
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: TSO control area (required for cost calculation)
          title: Tso Area
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummaryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Monthly Summary
      tags:
      - mabis
  /schedule-management/v1/mabis/send-response-to-aggregation-time-series:
    post:
      description: 'Send accept/reject response to an aggregation time series (BAS/ASZR). **Coming soon.**


        Once available, this will submit an IFTSTA message to the TSO/BIKO accepting or rejecting the aggregation time series data for a given month and version.'
      operationId: send_response_to_aggregation_time_series_schedule_management_v1_mabis_send_response_to_aggregation_time_series_post
      parameters:
      - description: Month for the response (YYYY-MM)
        in: query
        name: month
        required: true
        schema:
          description: Month for the response (YYYY-MM)
          title: Month
          type: string
      - description: Version identifier
        in: query
        name: version_id
        required: true
        schema:
          description: Version identifier
          title: Version Id
          type: string
      - description: Accept (true) or reject (false)
        in: query
        name: answer
        required: true
        schema:
          description: Accept (true) or reject (false)
          title: Answer
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregationObjectRequest'
        required: true
      responses:
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '501':
          content:
            application/json:
              schema: {}
          description: Coming soon.
      summary: Send Response To Aggregation Time Series
      tags:
      - mabis
      x-mint:
        content: <Note>**Coming soon.**</Note>
components:
  schemas:
    MonthlyEnergySummaryResponse:
      description: Response model for monthly energy summary.
      properties:
        aggregation_object_uid:
          anyOf:
          - type: string
          - type: 'null'
          description: Linked aggregation object UID
          title: Aggregation Object Uid
        bilanzierungsmonat:
          description: Settlement month (YYYY-MM-DD)
          title: Bilanzierungsmonat
          type: string
        data_status:
          description: MaBiS data status
          title: Data Status
          type: string
        interval_count:
          description: Number of intervals
          title: Interval Count
          type: integer
        mabis_zp_id:
          description: MaBiS-Zählpunkt ID
          title: Mabis Zp Id
          type: string
        message_date:
          description: Version timestamp (ISO datetime)
          title: Message Date
          type: string
        mscons_message_id:
          description: Version identifier
          title: Mscons Message Id
          type: string
        resolution:
