openapi: 3.2.0
info:
  title: Engrate Status Request API
  version: 1.0.0
servers:
- url: https://api.engrate.io
security:
- apiKeyAuth: []
tags:
- name: status-request
paths:
  /schedule-management/v1/send_status_request:
    post:
      description: 'Send a Status Request (SRQ) to a German TSO.


        This is a sort of "reset" functionality, where you can request the TSO re-emits messages for a specified schedule, which will then be re-ingested into Engrate.'
      operationId: send_status_request_schedule_management_v1_send_status_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequestCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusRequestResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Status Request
      tags:
      - status-request
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    StatusRequestResponse:
      description: Response from a status request submission to a TSO.
      properties:
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: Always `null`. An older version of this endpoint used this for messaging failures; the field is kept for backwards compatibility.
          title: Error Message
        message_id:
          description: Message identifier assigned to the status request.
          examples:
          - SRQ-20260326-100000-A1B2C3D4
          title: Message Id
          type: string
        next_allowed_at:
          anyOf:
          - type: string
          - type: 'null'
          description: Always `null`. An older version of this endpoint had rate limits here, but those are maintained internally now.
          title: Next Allowed At
        sent_at:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO 8601 datetime when the message was queued.
          examples:
          - '2026-03-26T10:00:00+00:00'
          title: Sent At
        status:
          const: queued
          description: Submission lifecycle state. An older version of this endpoint returned other status codes as well, but the only status returned now is `queued`; the field is retained for backwards compatibility.
          title: Status
          type: string
      required:
      - message_id
      - status
      title: StatusRequestResponse
      type: object
    StatusRequestCreate:
      additionalProperties: false
      description: Request body for sending a status request to TSO.
      properties:
        date:
          description: 'Delivery date (YYYY-MM-DD). Example: ''2026-01-24''.'
          format: date
          title: Date
          type: string
        sender_id:
          description: Your own EIC X code (balance responsible party, 16-character organization code) as registered with the TSO. Must match the EIC configured for the calling organization.
          title: Sender Id
          type: string
        tso:
          description: 'TSO identifier. DE values: ''50HERTZ_DE_TSO'' (50Hertz), ''DE-AMPRION-TSO'' (Amprion), ''TTG_DE'' (TenneT DE), ''DE-TRANSNETBWTSO'' (TransnetBW).'
          minLength: 1
          title: Tso
          type: string
      required:
      - date
      - sender_id
      - tso
      title: StatusRequestCreate
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
